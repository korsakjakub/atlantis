name: fork

on:
  push:
    branches:
      - "fork/**"
    tags:
      - "v*-fork*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
      - name: Build
        run: make build-service
      - name: Vet
        run: go vet ./...
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlantis
          path: ./atlantis
          if-no-files-found: error

  docker-build-push:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-fork')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        id: login
        continue-on-error: true # fail gracefully if packages are not permitted
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: alpine
          push: true
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            ATLANTIS_BASE_TAG_TYPE=alpine
            ATLANTIS_VERSION=${{ github.ref_name }}
            ATLANTIS_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/korsakjakub/atlantis:${{ github.ref_name }}
            ghcr.io/korsakjakub/atlantis:latest-fork
